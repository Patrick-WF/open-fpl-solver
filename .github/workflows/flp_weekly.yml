name: Weekly FPL Automated Solver & Telegram Report

on:
  schedule:
    # Runs every Friday at 08:00 UTC (Adjust as needed for FPL deadlines)
    - cron: '0 8 * * 5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-solver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv tabulate

      - name: Run FPL Bot Runner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_runner.py